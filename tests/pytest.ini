[pytest]
testpaths = tests
addopts = -v --tb=short
markers =
    e2e: End-to-end tests that require a fully trained pipeline and all data files
    slow: Tests that take longer than 10 seconds

# Run from project root: pytest
# Run CI-safe tests only: pytest tests/test_ci.py tests/test_feature_engineering.py tests/test_data.py
# Run e2e tests: pytest -m e2e