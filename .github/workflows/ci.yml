name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint, Format, and Test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-api.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-api.txt
        pip install pytest ruff black

    - name: Lint with ruff
      run: |
        ruff check src/ tests/ --output-format=github
      continue-on-error: false

    - name: Check formatting with black
      run: |
        black --check src/ tests/ --line-length=100
      # Report formatting issues but don't fail CI (just flag them)
      continue-on-error: true

    - name: Run CI-safe unit tests
      run: |
        pytest tests/test_ci.py tests/test_feature_engineering.py -v --tb=short
      # test_data.py and test_model.py require the trained pipeline artifact,
      # which is not available in CI without the full dataset.
      # They are run in the e2e_tests workflow instead.

    - name: Verify config files exist
      run: |
        python -c "
        import yaml, json, os
        with open('config/config.yaml') as f:
            config = yaml.safe_load(f)
        assert os.path.exists(config['model_assets']['main_table_top_features'])
        assert os.path.exists(config['model_assets']['final_top_features'])
        assert os.path.exists(config['model_assets']['model_parameters'])
        print('All config files verified.')
        "

  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t loan-default-prediction:ci .

    - name: Smoke test Docker container
      run: |
        # Start container in background
        docker run -d --name test-container -p 8000:8000 loan-default-prediction:ci
        # Wait for startup
        sleep 5
        # Test that the API responds (may return 200 or 503 depending on model presence)
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
        echo "API root response: $STATUS"
        [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ] && echo "Container started successfully" || exit 1
        docker stop test-container
        docker rm test-container

  security-check:
    runs-on: ubuntu-latest
    name: Dependency Security Check
    needs: lint-and-test
    continue-on-error: true  # Don't fail CI on vulnerability warnings

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install pip-audit
      run: pip install pip-audit

    - name: Audit dependencies
      run: |
        pip-audit -r requirements-api.txt --output=json > audit-results.json || true
        cat audit-results.json