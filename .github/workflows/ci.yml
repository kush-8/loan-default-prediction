name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Use the lean requirements file for a faster install
        pip install -r requirements-api.txt
        pip install pytest # Add pytest
    
    - name: Run simple API health check test
      run: |
        pytest tests/test_ci.py 

    - name: Build Docker image
      if: success()
      run: |
        docker build -t loan-default-prediction .