[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI pattern)
    "B904",   # raise from exc (too noisy in exception handlers)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F401"]   # tests may have long lines and unused imports in fixtures

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "e2e: Full pipeline tests requiring trained model + data files",
    "slow: Tests that take > 10 seconds",
    "integration: Integration tests requiring the API service",
]
